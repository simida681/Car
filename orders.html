<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 汽车商城</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="container">
                <span>品质保证 · 优质服务 · 值得信赖</span>
            </div>
        </div>
        <div class="header-main container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🚗</div>
                <span>汽车商城</span>
            </a>
            <nav>
                <ul class="nav-menu" id="headerNav"></ul>
            </nav>
            <div class="user-menu" id="userMenu"></div>
        </div>
    </header>

    <div class="orders-container">
        <div class="orders-header">
            <h2>我的订单</h2>
        </div>
        
        <div class="order-tabs">
            <button class="order-tab active" onclick="filterOrders('all')">全部</button>
            <button class="order-tab" onclick="filterOrders('pending_payment')">待支付</button>
            <button class="order-tab" onclick="filterOrders('paid')">已支付</button>
            <button class="order-tab" onclick="filterOrders('shipped')">配送中</button>
            <button class="order-tab" onclick="filterOrders('completed')">已完成</button>
        </div>
        
        <div class="orders-list" id="ordersList">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-section">
                    <h3>关于我们</h3>
                    <ul><li><a href="#">公司介绍</a></li></ul>
                </div>
                <div class="footer-section">
                    <h3>购车服务</h3>
                    <ul><li><a href="#">购车流程</a></li></ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; <span id="footerYear"></span> 汽车商城 版权所有</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        let allOrders = [];
        let currentFilter = 'all';

        async function init() {
            if (!Utils.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            renderHeader();
            renderFooter();
            await loadOrders();
        }

        async function loadOrders() {
            try {
                showLoading();
                allOrders = await Orders.getAll();
                renderOrders();
            } catch (e) {
                document.getElementById('ordersList').innerHTML = 
                    '<p style="text-align:center;padding:40px;">加载失败</p>';
            } finally {
                hideLoading();
            }
        }

        function renderOrders() {
            let orders = allOrders;
            
            if (currentFilter !== 'all') {
                orders = orders.filter(o => o.status === currentFilter);
            }
            
            if (orders.length === 0) {
                document.getElementById('ordersList').innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">📋</div>
                        <h3>暂无订单</h3>
                        <p>快去选购您心仪的车型吧</p>
                        <a href="cars.html" class="btn btn-primary">浏览车型</a>
                    </div>
                `;
                return;
            }
            
            document.getElementById('ordersList').innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id">订单号: ${order.id}</div>
                            <div class="order-date">${Utils.formatDate(order.created_at)}</div>
                        </div>
                        <span class="order-status ${order.status}">${getStatusText(order.status)}</span>
                    </div>
                    <div class="order-items">
                        ${order.items.map(item => `
                            <div class="order-item">
                                <img src="${item.car.image}" alt="${item.car.brand}" 
                                     class="order-item-image" onerror="this.src='https://via.placeholder.com/100x70'">
                                <div class="order-item-info">
                                    <div class="order-item-title">${item.car.brand} ${item.car.model}</div>
                                    <div class="order-item-price">${Utils.formatPrice(item.car.price)} × ${item.quantity}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="order-footer">
                        <div class="order-total">
                            合计: <span class="amount">${Utils.formatPrice(order.total)}</span>
                        </div>
                        <div>
                            ${renderOrderActions(order)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getStatusText(status) {
            const statusMap = {
                'pending_payment': '待支付',
                'paid': '已支付',
                'shipped': '配送中',
                'completed': '已完成',
                'cancelled': '已取消'
            };
            return statusMap[status] || status;
        }

        function renderOrderActions(order) {
            let buttons = '';
            
            if (order.status === 'pending_payment') {
                buttons += `<a href="payment.html?order_id=${order.id}" class="btn btn-primary btn-sm">去支付</a>`;
            }
            
            if (order.status === 'paid') {
                buttons += `<button class="btn btn-secondary btn-sm" onclick="confirmReceive('${order.id}')">确认收货</button>`;
            }
            
            buttons += `<button class="btn btn-outline btn-sm" onclick="viewOrderDetail('${order.id}')">查看详情</button>`;
            
            return buttons;
        }

        function filterOrders(status) {
            currentFilter = status;
            
            document.querySelectorAll('.order-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderOrders();
        }

        async function confirmReceive(orderId) {
            if (!confirm('确定已收到货物吗？')) return;
            
            try {
                showLoading();
                await Utils.request(`${API.orders}/${orderId}`, {
                    method: 'PUT',
                    body: { status: 'completed' }
                });
                Utils.showToast('确认收货成功', 'success');
                await loadOrders();
            } catch (e) {
                Utils.showToast(e.message || '操作失败', 'error');
            } finally {
                hideLoading();
            }
        }

        function viewOrderDetail(orderId) {
            window.location.href = `order-detail.html?id=${orderId}`;
        }

        init();
    </script>
</body>
</html>
