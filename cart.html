<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 汽车商城</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="container">
                <span>品质保证 · 优质服务 · 值得信赖</span>
            </div>
        </div>
        <div class="header-main container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🚗</div>
                <span>汽车商城</span>
            </a>
            <nav>
                <ul class="nav-menu" id="headerNav"></ul>
            </nav>
            <div class="user-menu" id="userMenu"></div>
        </div>
    </header>

    <div class="cart-container">
        <div class="cart-header">
            <h2>购物车</h2>
            <button class="btn btn-outline btn-sm" onclick="clearCart()" id="clearCartBtn" style="display:none;">清空购物车</button>
        </div>
        
        <div class="cart-content">
            <div class="cart-items" id="cartItems">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            
            <div class="cart-summary" id="cartSummary" style="display:none;">
                <h3>订单摘要</h3>
                <div class="summary-row">
                    <span>商品件数</span>
                    <span id="itemCount">0</span>
                </div>
                <div class="summary-row">
                    <span>商品总价</span>
                    <span id="subtotal">¥0</span>
                </div>
                <div class="summary-row">
                    <span>运费</span>
                    <span>¥0</span>
                </div>
                <div class="summary-row total">
                    <span>应付总额</span>
                    <span class="amount" id="totalAmount">¥0</span>
                </div>
                
                <div class="form-group" style="margin-top: 20px;">
                    <label>支付方式</label>
                    <select id="paymentMethod">
                        <option value="wechat">微信支付</option>
                        <option value="alipay">支付宝</option>
                    </select>
                </div>
                
                <button class="btn btn-primary btn-lg" onclick="checkout()">
                    💳 提交订单
                </button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-section">
                    <h3>关于我们</h3>
                    <ul><li><a href="#">公司介绍</a></li></ul>
                </div>
                <div class="footer-section">
                    <h3>购车服务</h3>
                    <ul><li><a href="#">购车流程</a></li></ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; <span id="footerYear"></span> 汽车商城 版权所有</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        async function init() {
            if (!Utils.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            renderHeader();
            renderFooter();
            await loadCart();
        }

        async function loadCart() {
            try {
                const cart = await Cart.get();
                const items = cart.items || [];
                
                if (items.length === 0) {
                    document.getElementById('cartItems').innerHTML = `
                        <div class="empty-cart">
                            <div class="empty-cart-icon">🛒</div>
                            <h3>购物车是空的</h3>
                            <p>快去挑选您心仪的车型吧</p>
                            <a href="cars.html" class="btn btn-primary">浏览车型</a>
                        </div>
                    `;
                    return;
                }
                
                document.getElementById('clearCartBtn').style.display = 'block';
                document.getElementById('cartSummary').style.display = 'block';
                
                document.getElementById('cartItems').innerHTML = items.map(item => `
                    <div class="cart-item">
                        <img src="${item.car.image}" alt="${item.car.brand} ${item.car.model}" 
                             class="cart-item-image" onerror="this.src='https://via.placeholder.com/200x150'">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.car.brand} ${item.car.model}</div>
                            <div class="cart-item-price">${Utils.formatPrice(item.car.price)}</div>
                            <div class="cart-item-controls">
                                <span>数量: ${item.quantity}</span>
                                <button class="btn-remove" onclick="removeFromCart('${item.car_id}')">删除</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                const total = cart.total || 0;
                document.getElementById('itemCount').textContent = items.length;
                document.getElementById('subtotal').textContent = Utils.formatPrice(total);
                document.getElementById('totalAmount').textContent = Utils.formatPrice(total);
            } catch (e) {
                document.getElementById('cartItems').innerHTML = '<p style="text-align:center;padding:40px;">加载失败</p>';
            }
        }

        async function removeFromCart(carId) {
            try {
                showLoading();
                await Cart.remove(carId);
                Utils.showToast('已从购物车移除', 'success');
                await loadCart();
                loadCartCount();
            } catch (e) {
                Utils.showToast(e.message || '移除失败', 'error');
            } finally {
                hideLoading();
            }
        }

        async function clearCart() {
            if (!confirm('确定要清空购物车吗？')) return;
            
            try {
                showLoading();
                await Cart.clear();
                Utils.showToast('购物车已清空', 'success');
                await loadCart();
                loadCartCount();
            } catch (e) {
                Utils.showToast(e.message || '清空失败', 'error');
            } finally {
                hideLoading();
            }
        }

        async function checkout() {
            const paymentMethod = document.getElementById('paymentMethod').value;
            
            try {
                showLoading();
                const result = await Orders.create(paymentMethod);
                const orderId = result.order.id;
                
                Utils.showToast('订单创建成功', 'success');
                window.location.href = `payment.html?order_id=${orderId}`;
            } catch (e) {
                Utils.showToast(e.message || '订单创建失败', 'error');
            } finally {
                hideLoading();
            }
        }

        init();
    </script>
</body>
</html>
